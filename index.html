<!doctype html>
<html lang="ur">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simon Game</title>
    <link rel="shortcut icon" href="fav-Icon.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="level-title">Press Start to Play</h1>

      <div class="btn-container">
        <div class="row">
          <div id="green" class="btn green" type="button"></div>
          <div id="red" class="btn red" type="button"></div>
        </div>
        <div class="row">
          <div id="yellow" class="btn yellow" type="button"></div>
          <div id="blue" class="btn blue" type="button"></div>
        </div>
      </div>

      <button id="start-btn">Start Game</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
